text: |
  Controller-to-worker state, task flags, worker UID selection, namespace
  creation, environment reconstruction, and task execution determine whether
  tasks intended to be offline are actually isolated. sstate.bbclass:150-159
  explicitly sets network=1 on every task in SSTATETASKS and its _setscene task.
  bitbake-worker:290-295 skips disable_network for network-enabled tasks; this
  is a distinct path from non-local UID handling or namespace creation failure.
  These are source-confirmed behaviors, not evidence of production egress or
  of the effective task flags after product metadata is applied.
trust_boundary: BitBake controller -> worker process/host kernel
