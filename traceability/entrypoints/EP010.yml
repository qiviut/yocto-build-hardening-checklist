text: |
  Shared-state objects and mirrors can replace task execution with reusable
  outputs. Their writers, readers, signatures, and provenance therefore form a
  supply-chain boundary. SSTATE_VERIFY_SIG defaults to 0 at sstate.bbclass:112-120;
  when enabled, sstate_installpkg verifies the signature before running unpack
  hooks at :349-390. gpg_sign.py:125-151 accepts a configured valid key when
  GOODSIG is present without independently checking the GPG exit status in that
  branch. This is a policy-gap hypothesis requiring a GPG fixture, not a
  confirmed signature bypass.
trust_boundary: cache writer/publisher -> release build
