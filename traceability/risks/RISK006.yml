preconditions: |
  Credentials, agent sockets, proxy values, helper paths, or user configuration
  are present in the original environment or datastore and are exported to a
  worker that executes untrusted build code.
record_type: risk
ref: ''
regression: |
  Inspect the effective worker environment and attempt harmless reads of known
  secret names and helper sockets; assert they are absent in release workers.
remediation: |
  Use a minimal environment allow-list, controlled PATH and helper settings,
  isolated HOME, and short-lived intake-only credentials. Keep release secrets
  outside build/test workers.
residual_uncertainty: |
  Source export behavior is mapped and the fixture confirms inheritance, but the
