evidence: |
  bitbake-worker:290-295 calls disable_network only for a task without an enabled
  network flag and with a local UID. utils.py:2072-2075 returns after an unshare
  failure. Recipe parsing occurs first at bitbake-worker:283. Independently,
  OE-Core sstate.bbclass:150-159 explicitly sets network=1 for SSTATETASKS and
  their _setscene tasks, skipping the helper even on a namespace-capable host.
  The repository worker-cache fixture changed the child network namespace, then
  observed PermissionError during user-namespace setup and a failed loopback
  probe. This confirms the helper-failure behavior on this host, not production
  egress policy.
