finding_id: F-002
header: |
  Conditional worker network isolation
impact: |
  A task expected to be offline can reach the network with worker credentials
  and can consume mutable data, undermining isolation and reproducibility.
level: 2.2
links:
- EP001: JuBHtv5qKHlbrV30vQWLcb_l2o4aDEKRVX-l7pwelAk=
- EP011: dMgYHrfwr1ZcpW8n_e9nOifJ-dneiPTmao13I3Fgydo=
- EP012: YgehLwcCOYNoRnKe_wBzqVTxCPRTmdJ3SV-67VXSqJE=
normative: true
preconditions: |
  The release lane relies on the BitBake helper as its primary control, while
  the task UID is not local, the host rejects user/network namespaces, or an
  effective network=1 flag skips the helper (including the sstate task path).
  Actual egress also requires the surrounding host/network policy to allow it.
record_type: risk
ref: ''
regression: |
  Run direct socket, DNS, curl/wget, Git, npm, Python, and native-helper probes
  in the release worker, including a host configuration where unshare fails.
  Inventory effective SSTATETASKS and _setscene network flags after parsing;
  probe those tasks separately from ordinary non-network tasks.
remediation: |
  Enforce egress denial below BitBake and fail closed when required isolation is
  unavailable. Emit a machine-readable isolation result for the release gate.
  Apply the non-intake policy even to explicitly network-enabled sstate tasks;
  do not treat a working namespace helper as coverage of the flagged path.
residual_uncertainty: |
  The actual production task list, effective flags, UID, kernel policy, firewall,
  and mount/network layout have not been inspected. The fixture is host-local;
  no product egress probe has been run, and the source flags do not establish a
  production network path.
reviewed: GzxZCK9PgjFbfsc2zh2p27OLIT8r62zAwINIdi4FtWU=
risk_status: operational-risk
severity: high
text: |
  A task intended to be offline may retain network access when BitBake's
  namespace helper is unavailable or skipped. Explicit sstate network flags
  also skip it by design; exfiltration or mutable fetches remain conditional on
  effective product metadata and the surrounding network controls.
