finding_id: F-008
header: |
  Mutable downloads and shared state
impact: |
  A release build can consume altered source or task output, bypass expected
  work, or inherit malicious metadata. This can undermine reproducibility and
  artifact integrity.
level: 2.8
links:
- EP008: OS6BdNMe6glonF6jJFRLEw48DzhWHzJqOCPz-j2EHII=
- EP010: MFhSS70yT4Mg4-AorIm34msDOjVrz5LaIP0U7WaeS84=
normative: true
preconditions: |
  A less-trusted job or actor can write or promote objects consumed by a release
  build, or cache signatures/provenance are not enforced at restore time.
record_type: risk
ref: ''
regression: |
  Tamper with downloads, stamps, sstate objects, and signatures in a disposable
  build and assert rejection or forced rebuild. Add GPG fixtures for valid,
  invalid, wrong-key, non-zero-exit-with-GOODSIG, and empty-allow-list cases.
remediation: |
  Separate cache namespaces and writers, enforce signatures/provenance before
  promotion and restore, retain cache manifests, and quarantine after compromise.
  Require the verification path to reject a non-zero GPG exit even when a
  configured key ID appears in GOODSIG output; do not rely on the source
  default SSTATE_VERIFY_SIG=0 for release assurance.
residual_uncertainty: |
  Actual cache permissions, restore implementation, mirror ownership,
  SSTATE_VERIFY_SIG/SSTATE_VALID_SIGS configuration, and the product's
  configured GPG/keyring behavior remain unverified. The fake-GPG branch is
  intentionally only source-level control-flow evidence.
reviewed: uRQ4ddblxoZTlxuduxv4CCYnkB7UtiNzBIPYvk4CnMM=
risk_status: operational-risk
severity: high
text: |
  Writable downloads, mirrors, stamps, and shared-state objects can become
  accepted build inputs for a later worker without a fresh independent trust
  decision. The sstate signature policy is also configuration-sensitive:
  verification is off by default, and the configured-key branch needs a fixture
  to determine whether a non-zero GPG result can be accepted on GOODSIG alone.
