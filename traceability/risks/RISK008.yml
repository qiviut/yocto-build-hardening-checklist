evidence: |
  The fetch path reuses DL_DIR/done-stamp state at fetch/__init__.py:685-747.
  OE-Core package tasks produce sstate at package.bbclass:548-621. At
  sstate.bbclass:112-120, SSTATE_VERIFY_SIG defaults to 0. When verification is
  enabled, sstate_installpkg calls signer.verify before unpack hooks at
  :349-390. In gpg_sign.py:125-151, an empty valid-key list checks the GPG exit
  code, while a non-empty list returns on a matching GOODSIG without checking
  that code. The repository worker-cache fixture verified real valid/tampered
  payload results and reproduced the non-zero-GOODSIG branch with an isolated
  fake GPG executable. It does not validate product cache policy.
