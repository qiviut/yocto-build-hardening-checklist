preconditions: |
  A less-trusted job or actor can write or promote objects consumed by a release
  build, or cache signatures/provenance are not enforced at restore time.
record_type: risk
ref: ''
regression: |
  Tamper with downloads, stamps, sstate objects, and signatures in a disposable
  build and assert rejection or forced rebuild.
remediation: |
  Separate cache namespaces and writers, enforce signatures/provenance before
  promotion and restore, retain cache manifests, and quarantine after compromise.
residual_uncertainty: |
  Actual cache permissions, restore implementation, mirror ownership, and
  SSTATE_VERIFY_SIG configuration remain unverified.
