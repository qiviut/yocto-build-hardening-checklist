text: |
  The operating model shall track the moving Yocto development line while
  binding each candidate to immutable source, recipe, configuration, and
  toolchain identities; keep third-party diagnostics advisory to the ordinary
  build/test gate; assess product-applicable recipe and runtime hardening; and
