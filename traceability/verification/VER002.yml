observed: |
  The 2026-09-21 local runner changed the child network namespace, then
  observed PermissionError during user-namespace setup and OSError on the
  post-helper loopback probe. A separate direct-process loopback fixture saw
  disable_network() return without changing the namespace and local Python,
  curl, wget, Git, and npm requests reach the temporary server. Source review
  confirms that sstate sets network=1 and that the worker skips disable_network
  when that flag is enabled. No product worker, effective task flags, or host
  egress policy was available.
