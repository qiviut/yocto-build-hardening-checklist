expected: |
  The upstream reference profile expands to qemux86-64/nodistro with the
  upstream strict-checksum default. The mitigation profile adds BB_NO_NETWORK=1,
  SSTATE_MIRROR_ALLOW_NETWORK=0, and SSTATE_VERIFY_SIG=1. The verifier rejects
  inherited policy overrides and effective-value mismatches, and records the
  clean analysis revision and input hashes. Against the same harmless URI, the
  reference fetch succeeds and the mitigation fails before making a network
  request.
