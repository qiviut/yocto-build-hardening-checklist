links:
- CTRL002: Sk7eNBwTjF0P5PXzTIADfhcwecFUsWyhDvxEiv_TyWY=
method: fixture
normative: true
observed: |
  Parse-only expansion succeeded for both profiles at the pinned revisions,
  with OE-Core sanity explicitly skipped because this host lacks chrpath and
  diffstat and cannot pass the normal host gate. The reference profile had
  MACHINE=qemux86-64, DISTRO=nodistro, BB_STRICT_CHECKSUM=1, and
  SSTATE_VERIFY_SIG=0. The mitigation profile changed BB_NO_NETWORK to 1 and
  SSTATE_MIRROR_ALLOW_NETWORK to 0 and SSTATE_VERIFY_SIG to 1 while retaining
  strict checksums. The loopback fixture made one request and matched bytes
  under BB_NO_NETWORK=0; under BB_NO_NETWORK=1 it raised NetworkAccess and made
  zero server requests. This does not prove task-level socket denial, signed
  sstate verification, or product reachability.
