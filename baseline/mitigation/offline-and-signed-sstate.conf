# Non-secret mitigation fragment applied after the reference baseline.
# Source/configuration evidence only: signing-key provisioning and host-level
# egress denial must be supplied by the deployment and verified separately.

# After controlled intake, fetcher network access must fail closed.
BB_NO_NETWORK = "1"
# Do not let sstate mirror fetches override BB_NO_NETWORK.
SSTATE_MIRROR_ALLOW_NETWORK = "0"

# Preserve the upstream nodistro strict-checksum policy explicitly.
BB_STRICT_CHECKSUM = "1"

# Require signatures for shared-state reuse. Do not put private key material or
# a product keyring in this repository; provide the reviewed public-key setup in
# a separate protected configuration when exercising signed sstate.
SSTATE_VERIFY_SIG = "1"
